[project]
name = "bazaar-contrib-legacy-node-migrations"
version = "0.3.0rc14"
description = "Published Node 1–32 historical database upgrades"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "bazaar-contrib-storage~=0.3.0rc1", "bazaar-contrib-schema~=0.3.0rc1"]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-legacy-node-migrations"

[project.entry-points."bazaar_compute_node.contribs"]
legacy-node-migrations = "bazaar_contrib_legacy_node_migrations:migrations"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "bazaar-compute-node~=0.3.0rc14",
    "bazaar-contrib-agent~=0.3.0rc14",
    "bazaar-contrib-collaboration~=0.3.0rc14",
    "bazaar-contrib-messages-node~=0.3.0rc14",
    "bazaar-contrib-reminder~=0.3.0rc14",
    "bazaar-contrib-sqlite~=0.3.0rc10",
    "aiosqlite>=0.20.0",
    "packaging>=24.0",
    "tomli-w>=1.0.0",
    "blockbuster>=1.5.29,<1.6",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
